- insert:
    - id: open-source-collaboration
      name: '@dangosys/dsh-open-source-collaboration'
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: role
      name: '@dangosys/dsh-open-source-collaboration/role'
      config:
        clientId: Ov23lixMRqTArZkZ92EI
        scopes: read:user repo
    - id: repository-manage
      name: '@dangosys/dsh-open-source-collaboration/repository-manage'
    - id: collaboration-panel
      name: '@dangosys/dsh-open-source-collaboration/collaboration-panel'
    - id: github-bot
      name: '@dangosys/dsh-open-source-collaboration/github-bot'
      config:
        orgs:
          DangoSys:
            appId: 2997069
            installationId: 113732214
            privateKeyFile: ''  # operator fills absolute path to ChipCrowd App PEM
